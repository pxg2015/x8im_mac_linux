name: build-macos

# X8.IM 桌面客户端 — macOS 构建（Apple Silicon + Intel 双架构）
# 触发：手动（Actions 页面点 Run workflow）或推送 v* 标签
# 产物：X8.IM-apple-silicon.dmg / X8.IM-intel.dmg
#
# 签名与公证（2026-11-14 接入 Developer ID）：
#   Team：Tianjian Software (changzhou) Co., Ltd / TeamID 8X895M57PW
#   身份：Developer ID Application: Tianjian Software (changzhou) Co., Ltd (8X895M57PW)
#   需要的 7 个 secrets（少任一 → 自动降级为未签名构建，保持历史行为、不阻塞出包）：
#     APPLE_CERTIFICATE          p12 的 base64（单行，openssl 带链导出）
#     APPLE_CERTIFICATE_PASSWORD p12 口令
#     APPLE_SIGNING_IDENTITY     上面那串完整身份名
#     APPLE_TEAM_ID              8X895M57PW
#     APPLE_API_KEY              App Store Connect API Key ID（10 位）
#     APPLE_API_ISSUER           ASC 的 Issuer ID（UUID）
#     APPLE_API_KEY_P8           AuthKey_<KEYID>.p8 的【原文】（不是 base64）
#
#   注意：APNs 推送密钥 AuthKey_468HJB6826.p8 与公证密钥是两把不同的 EC P-256 私钥，
#   前者只有 Key ID 没有 Issuer，不能用于 notarytool —— 别混。
#   证书到期 2027-12-14，到期前换证重签（已发版本不受影响）。
#
# 仓库结构约定：git 仓根 = im/，桌面端在 desktop/ 子目录。
# GitHub Actions 只读取【仓库根】的 .github/workflows/，故本文件放在 im/.github/workflows/。
#
# ⚠️ 两个必须同时遵守的路径规则（踩过坑）：
#   1) `run:` 步骤统一用 defaults.run.working-directory: desktop 切到桌面端目录；
#   2) `uses:` 步骤（尤其 actions/upload-artifact 的 path）【不受】working-directory 影响，
#      路径相对仓库根，必须显式带 desktop/ 前缀。
#      早期写成 out/*.dmg 时，构建成功也会因「找不到产物」在最后一步报错。
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

concurrency:
  group: build-macos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.label }}
    # 2026-11-06：macos-14（Sonoma，arm64）镜像已于 2026-11-02 正式退役。
    # 继续写 macos-14 会让 job 在 0 秒内被取消，报错形似
    # "The configuration 'macos-14-arm64-us-default' is not supported"，
    # 极易被误判成 Actions 额度用尽（public 仓其实免费、无额度）。
    # 实测 macos-14=cancelled / macos-15=success / macos-latest=success。
    # 固定 macos-15（arm64）而非 macos-latest：latest 现已指向 macos-26，
    # Xcode 跨度更大；两个 target 仍都在 arm64 机器上（x86_64 走交叉编译）。
    runs-on: macos-15
    timeout-minutes: 90
    defaults:
      run:
        working-directory: desktop
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            label: apple-silicon
            rustdesk: rustdesk-1.5.0-aarch64.dmg
          - target: x86_64-apple-darwin
            label: intel
            rustdesk: rustdesk-1.5.0-x86_64.dmg
    env:
      RUST_BACKTRACE: "1"
      # 自建 RustDesk 服务器地址/公钥，由仓库 Settings→Secrets 注入（不写死在源码）。
      # 未配置则远程协助不可用（不影响构建与其它功能）。
      RD_SERVER: ${{ secrets.RD_SERVER }}
      RD_SERVER_KEY: ${{ secrets.RD_SERVER_KEY }}
      # 签名开关：证书 + 身份都在才走签名分支，否则保持未签名（只出包不签名）。
      HAS_SIGNING: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_SIGNING_IDENTITY != '' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4

      # 🔴 2026-11-06 根治「Key 不匹配」：Secrets 里的 RD_SERVER_KEY 曾经少一个字符
      # （43 位 vs 正确的 44 位），编译进客户端后与服务端 hbbs 的公钥不等，
      # 用户侧只看到「Key 不匹配」且无从定位。这里在构建前硬校验，配错直接红。
      - name: Verify RustDesk server key (must be 44-char base64)
        run: |
          set -euo pipefail
          if [ -z "${RD_SERVER:-}" ]; then echo "::error::RD_SERVER secret 未配置"; exit 1; fi
          if [ "${#RD_SERVER_KEY}" -ne 44 ]; then
            echo "::error::RD_SERVER_KEY 长度为 ${#RD_SERVER_KEY}，必须为 44（ed25519 公钥 base64 标准长度）"
            exit 1
          fi
          if [ "${RD_SERVER_KEY: -1}" != "=" ]; then echo "::error::RD_SERVER_KEY 尾部缺少 '='"; exit 1; fi
          echo "RD_SERVER=${RD_SERVER}；RD_SERVER_KEY 长度 44 ✓"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          # workspaces 相对仓库根，需带 desktop/ 前缀
          workspaces: desktop/src-tauri
          key: macos-${{ matrix.label }}

      # 先把「环境是否就绪」一次性打出来并断言。任何一步缺失都在这里秒挂，
      # 而不是等 Rust 编译十分钟后才报一句看不懂的错。
      - name: Preflight
        run: |
          set -euo pipefail
          echo "== runner =="; sw_vers; uname -m
          echo "== node =="; node -v; npm -v
          echo "== rust =="; rustc -V; cargo -V
          echo "== installed targets =="; rustup target list --installed | tr '\n' ' '; echo
          echo "== xcode =="; xcode-select -p
          echo "== disk =="; df -h / | tail -1
          for f in package.json package-lock.json \
                   src-tauri/Cargo.toml src-tauri/build.rs \
                   src-tauri/tauri.conf.json src-tauri/tauri.macos.conf.json \
                   src-tauri/icons/icon.icns; do
            if [ -f "$f" ]; then echo "  ✓ $f"; else echo "::error::缺少必需文件 $f"; exit 1; fi
          done
          echo "preflight ok"

      - name: Install deps
        run: npm ci

      # 主窗口加载的是远端 https://im.x8fde.com/app/，本地 frontendDist 仅为满足
      # Tauri 打包要求（路径必须存在），放一个占位页即可，不参与实际运行
      - name: Prepare frontendDist placeholder
        run: |
          set -euo pipefail
          mkdir -p dist
          printf '%s\n' '<!doctype html><meta charset="utf-8"><title>X8.IM</title>' > dist/index.html

      # ===== 签名前置：把 p12 装进临时钥匙串 =====
      # 只在 HAS_SIGNING=1 时执行。p12 必须用 openssl 带链导出（叶证书 + G2 中间证书），
      # 否则 codesign 报 "unable to build chain to self-signed root"、公证必被拒。
      # 私钥口令正确但缺 set-key-partition-list 时，codesign 会弹钥匙串授权框，
      # CI 无交互直接失败（报 User interaction is not allowed）—— 这行不能省。
      - name: Import Developer ID certificate
        if: env.HAS_SIGNING == '1'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          KC="$RUNNER_TEMP/build.keychain-db"
          KCPW=$(openssl rand -base64 24)
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          # macOS 是 BSD base64：只能 -D / -d，不支持 --decode（GNU 长选项会报 illegal option）
          printf '%s' "$APPLE_CERTIFICATE" | base64 -D > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security >/dev/null
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPW" "$KC" >/dev/null
          # 把新钥匙串并进搜索列表（不能只留它一个，login.keychain 里还有系统根）
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          echo "== 可用签名身份 =="
          security find-identity -v -p codesigning "$KC"
          security find-identity -v -p codesigning "$KC" | grep -qF "$APPLE_SIGNING_IDENTITY" || {
            echo "::error::钥匙串里找不到签名身份：$APPLE_SIGNING_IDENTITY"; exit 1; }
          if security find-certificate -c "Developer ID Certification Authority" "$KC" >/dev/null 2>&1; then
            echo "  ✓ G2 中间证书已在链内"
          else
            echo "::warning::未发现 G2 中间证书 —— p12 可能未带链，公证大概率失败"
          fi

      # ===== 公证凭据：把 .p8 落地成文件 =====
      # Tauri 认 APPLE_API_KEY_PATH / APPLE_API_KEY / APPLE_API_ISSUER 三件套。
      # .p8 是 PEM 原文，secret 里直接存原文（不要再 base64，避免多一层换行坑）。
      - name: Prepare notarization API key
        if: env.HAS_SIGNING == '1'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          set -euo pipefail
          [ -n "${APPLE_API_KEY_P8:-}" ] || { echo "::error::APPLE_API_KEY_P8 未配置，无法公证"; exit 1; }
          [ -n "${APPLE_API_KEY:-}" ]    || { echo "::error::APPLE_API_KEY 未配置，无法公证"; exit 1; }
          KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
          printf '%s' "$APPLE_API_KEY_P8" | tr -d '\r' > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          # 文件名必须是 AuthKey_<KEYID>.p8 —— notarytool 会按文件名核对 Key ID
          grep -q "BEGIN PRIVATE KEY" "$KEY_PATH" || { echo "::error::p8 内容不是 PEM 私钥"; exit 1; }
          echo "APPLE_API_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"
          echo "  ✓ 公证密钥就位：$KEY_PATH"

      # 签名版：Tauri 在同一进程内完成 sign app → notarize → staple → 建 dmg → sign dmg。
      # 这里【不】设 APPLE_ID/APPLE_PASSWORD，避免与 API Key 两套凭据打架。
      - name: Build dmg (signed + notarized)
        if: env.HAS_SIGNING == '1'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: npx tauri build --target ${{ matrix.target }}

      # 降级版：secrets 未配齐时照旧出未签名包（Gatekeeper 需 mac.sh 清隔离，历史行为）
      - name: Build dmg (unsigned fallback)
        if: env.HAS_SIGNING != '1'
        run: |
          echo "::warning::未配置签名 secrets，本次产出未签名包（用户侧需 mac.sh 清 quarantine）"
          npx tauri build --target ${{ matrix.target }}

      # 签名/公证断言：失败要红在签名这一步，不能拖到用户装不上才发现
      - name: Verify signature & notarization
        if: env.HAS_SIGNING == '1'
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          T=${{ matrix.target }}
          APP=src-tauri/target/$T/release/bundle/macos/BangXin.app

          echo "== codesign 身份 =="
          codesign -dv --verbose=4 "$APP" 2>&1 | grep -E "Identifier|TeamIdentifier|Authority|Timestamp" || true
          codesign -dv --verbose=4 "$APP" 2>&1 | grep -q "Developer ID Application" || {
            echo "::error::app 未用 Developer ID 签名"; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$APP"
          echo "  ✓ 签名严格校验通过"

          echo "== 公证票据（app） =="
          if xcrun stapler validate -v "$APP"; then
            echo "  ✓ app 已装订票据"
          else
            echo "::warning::app 无票据，补提交公证"
            ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/app.zip"
            xcrun notarytool submit "$RUNNER_TEMP/app.zip" \
              --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" \
              --issuer "$APPLE_API_ISSUER" --wait
            xcrun stapler staple -v "$APP"
            xcrun stapler validate -v "$APP"
          fi

          echo "== Gatekeeper 评估（app） =="
          spctl -a -vvv -t exec "$APP" || echo "::warning::spctl 未 accepted（联网状态/票据延迟时偶发，不阻塞）"

          echo "== dmg 逐个校验 =="
          for D in src-tauri/target/$T/release/bundle/dmg/*.dmg; do
            [ -e "$D" ] || { echo "::error::没有 dmg"; exit 1; }
            echo "-- $(basename "$D")"
            codesign --verify --strict --verbose=2 "$D" || echo "::warning::dmg 未签名（Tauri 版本差异，用户装 .app 仍可用）"
            if xcrun stapler validate "$D" >/dev/null 2>&1; then
              echo "  ✓ dmg 已装订票据"
            else
              echo "  dmg 无票据，补提交公证（幂等）"
              xcrun notarytool submit "$D" \
                --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" \
                --issuer "$APPLE_API_ISSUER" --wait
              xcrun stapler staple "$D"
              xcrun stapler validate "$D"
            fi
          done

      - name: Assert Info.plist & version in bundle
        run: |
          set -euo pipefail
          APP=src-tauri/target/${{ matrix.target }}/release/bundle/macos/BangXin.app
          PLIST="$APP/Contents/Info.plist"
          test -f "$PLIST" || { echo "::error::bundle 内找不到 Info.plist"; exit 1; }
          EXPECT_VER=$(python3 -c "import json;print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          GOT_VER=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST")
          [ "$GOT_VER" = "$EXPECT_VER" ] || {
            echo "::error::版本不一致 —— 包内=${GOT_VER}，tauri.conf.json=${EXPECT_VER}"
            exit 1
          }
          echo "  ✓ 版本：$GOT_VER"
          BAD=0
          for K in NSMicrophoneUsageDescription NSCameraUsageDescription NSAppleEventsUsageDescription; do
            V=$(/usr/libexec/PlistBuddy -c "Print :$K" "$PLIST" 2>/dev/null || true)
            if [ -n "$V" ]; then echo "  ✓ $K = $V"; else echo "  ✗ 缺 $K"; BAD=1; fi
          done
          [ "$BAD" = 0 ] || {
            echo "::error::Info.plist 隐私用途声明缺失 —— 会议/藏窗会在 macOS 上被 TCC 终止进程"
            exit 1
          }
          BIN=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$PLIST")
          EXE="$APP/Contents/MacOS/$BIN"
          test -x "$EXE" || { echo "::error::CFBundleExecutable 缺失或不可执行：$EXE"; exit 1; }
          echo "  ✓ 主程序可执行：$EXE ($(/usr/bin/du -h "$EXE" | cut -f1))"
          # dmg 内是用户真正拿到的那份，再对 dmg 验一次（挂载只读，不改内容）
          for DMG in src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg; do
            [ -e "$DMG" ] || continue
            MNT=$(mktemp -d)
            hdiutil attach "$DMG" -mountpoint "$MNT" -nobrowse -quiet
            DPLIST="$MNT/BangXin.app/Contents/Info.plist"
            test -f "$DPLIST" || { echo "::error::dmg 内找不到 Info.plist"; hdiutil detach "$MNT" -quiet; exit 1; }
            DV=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$DPLIST")
            [ "$DV" = "$EXPECT_VER" ] || { echo "::error::dmg 内版本不一致：$DV != $EXPECT_VER"; hdiutil detach "$MNT" -quiet; exit 1; }
            for K in NSMicrophoneUsageDescription NSCameraUsageDescription NSAppleEventsUsageDescription; do
              /usr/libexec/PlistBuddy -c "Print :$K" "$DPLIST" >/dev/null 2>&1 || {
                echo "::error::dmg 内缺 $K"; hdiutil detach "$MNT" -quiet; exit 1
              }
            done
            echo "  ✓ dmg 内 Info.plist 齐全（$(basename "$DMG")，版本 ${DV}）"
            hdiutil detach "$MNT" -quiet
            rm -rf "$MNT"
          done

      - name: Collect artifacts
        run: |
          set -euo pipefail
          B=src-tauri/target/${{ matrix.target }}/release/bundle
          mkdir -p out
          ls -lh "$B/dmg" || { echo "::error::没有 dmg 目录，构建未产出安装包"; exit 1; }
          cp "$B"/dmg/*.dmg "out/X8.IM-${{ matrix.label }}.dmg"
          # 2026-11-02 mac 静默升级：tauri-plugin-updater 的更新包格式是 .app.tar.gz
          #（内含 .app bundle，插件按 tar 顶层条目=.app 解包后原地替换 /Applications 下的 app）。
          # 从**修好符号链接后的最终 dmg** 里取 .app 原样打包 —— 绝不能用 ditto（会解引用链接、
          # 丢掉 _CodeSignature），否则装上去的 RustDesk 又会崩。
          # COPYFILE_DISABLE=1 防止 bsdtar 塞 ._AppleDouble 文件；--no-xattrs 不写扩展属性。
          MNT=$(mktemp -d)
          hdiutil attach "$B"/dmg/*.dmg -mountpoint "$MNT" -nobrowse -quiet
          APP=$(find "$MNT" -maxdepth 1 -name "*.app" | head -1)
          test -n "$APP" || { echo "::error::dmg 内未找到 .app"; exit 1; }
          # 2026-11-14 签名后调整：不再加 --no-xattrs。
          # 公证票据（notary ticket）在 mac 上可能以扩展属性/包内附加物形式存在，
          # 剥掉 xattr 有丢票据风险 → 用户端离线首启会被 Gatekeeper 拦。
          # COPYFILE_DISABLE=1 仍然保留（禁 bsdtar 塞 ._AppleDouble）。
          COPYFILE_DISABLE=1 tar -czf "out/X8.IM-${{ matrix.label }}.app.tar.gz" \
            -C "$MNT" "$(basename "$APP")"
          hdiutil detach "$MNT" -quiet
          rmdir "$MNT" 2>/dev/null || true
          echo "updater 产物："
          ls -lh out/*.app.tar.gz
          ls -lh out

      # 失败时把关键现场打出来，省得再去翻几十兆日志
      - name: Dump diagnostics on failure
        if: failure()
        run: |
          echo "=== src-tauri/bin/mac ==="; ls -la src-tauri/bin/mac 2>/dev/null || true
          echo "=== bundle 目录 ==="; find src-tauri/target -maxdepth 5 \( -name '*.app' -o -name '*.dmg' \) 2>/dev/null | head -20 || true
          echo "=== 内嵌 RustDesk 框架 ==="; ls src-tauri/target/*/release/bundle/macos/BangXin.app/Contents/Resources/bin/mac/RustDesk.app/Contents/Frameworks 2>/dev/null | head -5 || true

      - uses: actions/upload-artifact@v4
        with:
          name: x8im-macos-${{ matrix.label }}
          # ⚠️ uses 步骤不受 defaults.run.working-directory 影响，路径相对仓库根
          # 2026-11-02：*.app.tar.gz 是 mac 静默升级的更新包（签名 .sig 在本机生成，不进 CI）
          path: |
            desktop/out/*.dmg
            desktop/out/*.app.tar.gz
          if-no-files-found: error

      # 说明：产物不由 CI 直接回传服务器（避免把服务器密钥放进 GitHub）。
      # 由本地用 API 下载 artifact 后再 scp 至 /opt/x8im/mac/。
