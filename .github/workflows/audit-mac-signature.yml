name: audit-mac-signature
# 申诉取证：对现役包 + 被吊销签名包跑 codesign / spctl 自查，产出**纯文本**报告 artifact
# 🔴 关键：artifact 只允许含 .txt 报告；解包出来的 .app / .tar.gz 一律不得进 artifact
#    （带吊销 Developer ID 签名的二进制若落到公开 artifact = 对外重新分发，恶化申诉）
on:
  workflow_dispatch:
    inputs:
      versions:
        description: '逗号分隔的版本号（默认：1.7.0=带吊销签名的旧包，1.7.21=现役未签名包）'
        default: '1.7.0,1.7.21'
jobs:
  audit:
    # 🔴 macos-14（Sonoma arm64）镜像 2026-11-02 已退役 → job 0 秒内被取消（形似 cancelled）
    #    固定 macos-15（同 build-macos.yml 的选择）
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: 下载待审包
        run: |
          set -u
          mkdir -p /tmp/audit /tmp/audit-report && cd /tmp/audit
          for v in ${{ inputs.versions }}; do
            for a in apple-silicon intel; do
              curl -fsSL --max-time 300 -o "$a-$v.tar.gz" \
                "https://download.x8fde.com/x8im/download/BangXin-$a-$v.app.tar.gz" \
                || echo "SKIP $a-$v (不可下载)"
            done
          done
          ls -la /tmp/audit

      - name: codesign / spctl 自查（只产出文本）
        run: |
          set -u
          cd /tmp/audit
          for f in *.tar.gz; do
            [ -s "$f" ] || continue
            { echo "################ $f ################"
              echo "downloaded_at: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
              echo "source: https://download.x8fde.com/x8im/download/$f"
              echo
              rm -rf x && mkdir x && tar -xzf "$f" -C x
              app=$(find x -maxdepth 2 -name '*.app' -type d | head -1)
              echo "--- codesign -dv --verbose=4 ---"
              codesign -dv --verbose=4 "$app" 2>&1 || true
              echo "--- codesign -vvv --deep --strict ---"
              codesign -vvv --deep --strict "$app" 2>&1 || true
              echo "--- spctl -a -t exec -vv ---"
              spctl -a -t exec -vv "$app" 2>&1 || true
              echo "--- Info.plist: ShortVersion / Localizations ---"
              /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist" 2>&1 || true
              /usr/libexec/PlistBuddy -c 'Print :CFBundleLocalizations' "$app/Contents/Info.plist" 2>&1 || true
              /usr/libexec/PlistBuddy -c 'Print :CFBundleDevelopmentRegion' "$app/Contents/Info.plist" 2>&1 || true
              echo
            } > "/tmp/audit-report/audit-${f%.tar.gz}.txt" 2>&1
            rm -rf x
          done
          ls -la /tmp/audit-report

      - name: 清掉二进制，只留文本报告
        run: |
          rm -rf /tmp/audit
          echo "--- artifact 内容清单（应只有 .txt） ---"
          find /tmp/audit-report -type f -exec ls -la {} \;

      - name: 归档报告（仅文本）
        uses: actions/upload-artifact@v4
        with:
          name: mac-signature-audit
          path: /tmp/audit-report
          retention-days: 30
