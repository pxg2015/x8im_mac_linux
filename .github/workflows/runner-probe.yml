name: runner-probe
on:
  workflow_dispatch:
jobs:
  probe:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [macos-13, macos-14, macos-15, macos-latest]
    steps:
      - name: whoami
        run: |
          sw_vers
          uname -m
          echo "runner=$RUNNER_NAME arch=$RUNNER_ARCH os=$RUNNER_OS"
