<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI 邦灵</title>
<!--
  AI 邦灵 · 卡通精灵新消息提醒（2026-11-16 老8：托盘提示不明显，要个会动的精灵）

  由 Rust 侧 fde_float_show_impl 以无边框透明置顶窗口加载，窗口 148x196（逻辑像素）。
  参数：?n=未读数&t=提示文案（会话名 或「发送人：内容」）。

  与 2026-10-22 版浮窗的差别（针对「提示不明显」的三条根因）：
    ① 有未读就**不自动收起**——停在屏上到未读清零 / 手动收起（旧版 9.2s 消失，人一走开就错过）
    ② 提示音交给 Rust（PlaySoundW 系统通知音），这里只管视觉
    ③ 位置可拖动并记忆（Rust pet_drag_begin → pet.json），多屏跟随主窗所在屏

  交互：
    单击精灵  → 唤起主窗（fde_float_click）
    按住/拖   → 移动位置（pet_drag_begin，松手自动记忆）
    右键      → 小菜单：静音提示音 / 收起
-->
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;background:transparent;overflow:hidden;
    user-select:none;-webkit-user-select:none;font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif}
  /* ── AI 邦灵 尺寸三档（2026-11-18 老8：大 / 中 / 小，默认小） ──
     档位由 Rust 侧注入（pet.json: size → pet_set_size → __fdeSize('s'|'m'|'l')），
     建窗瞬间由 on_page_load 注入一次。窗口尺寸跟着档位走（Rust: fde_float_wh）：
       小 s = 96x150（pet 56px）· 中 m = 120x174（pet 74px）· 大 l = 148x196（pet 92px）
     变量化而非写死像素：改一档只动这里 + Rust 的 FDE_FLOAT_SIZE_* 两处。
     🔴 优先级：html[data-sz] (0,1,1) > :root (0,1,0) → 档位永远压得住下面的兼容媒体查询。 */
  :root{
    --pet:56px;        /* 精灵直径 */
    --tipw:74px;       /* 气泡内容最大宽（不含 padding） */
    --tipfs:10px;      /* 气泡字号 */
    --tiplh:15px;      /* 气泡行高 */
    --tippad:4px 7px;  /* 气泡内边距 */
    --tipmt:8px;       /* 气泡上间距 */
    --badge:17px;      /* 未读角标 */
    --badgef:9.5px;    /* 角标字号 */
    --xbtn:15px;       /* 关闭按钮 */
    --namefs:9px;      /* 名字牌字号 */
    --nameh:13px;
    --menutop:26px;
  }
  html[data-sz="m"]{--pet:74px;--tipw:96px;--tipfs:10.5px;--tiplh:15px;--tippad:5px 8px;--tipmt:9px;
    --badge:19px;--badgef:10.5px;--xbtn:17px;--namefs:9.5px;--nameh:15px;--menutop:30px}
  html[data-sz="l"]{--pet:92px;--tipw:136px;--tipfs:11px;--tiplh:15px;--tippad:5px 9px;--tipmt:11px;
    --badge:20px;--badgef:11px;--xbtn:18px;--namefs:10px;--nameh:16px;--menutop:34px}
  #wrap{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
    padding:4px 4px 6px;box-sizing:border-box;opacity:0;transform:translateY(26px) scale(.86);
    transition:opacity .26s cubic-bezier(.2,.8,.3,1),transform .42s cubic-bezier(.2,1.3,.4,1)}
  #wrap.in{opacity:1;transform:none}
  #wrap.out{opacity:0;transform:translateY(10px) scale(.9);transition-duration:.24s}

  /* 精灵本体 */
  .pet{position:relative;width:var(--pet);height:var(--pet);flex:0 0 auto;cursor:pointer}
  .pet .ring{position:absolute;inset:-5px;border-radius:50%;
    background:radial-gradient(circle,rgba(0,130,252,.34) 0%,rgba(0,130,252,0) 68%);opacity:0}
  .pet .face{position:absolute;inset:0;border-radius:50%;overflow:hidden;background:#fff;
    box-shadow:0 8px 22px rgba(16,22,38,.28),0 0 0 2.5px #fff,0 0 0 4px rgba(0,130,252,.22)}
  /* 头像加载失败兜底：至少是个看得见的蓝圆，不能只剩一块白 */
  .pet .face.noface{background:radial-gradient(circle at 50% 42%,#9ad4ff 0%,#0082fc 72%)}
  .pet .face img,.pet .face video{width:100%;height:100%;object-fit:cover;display:block}
  /* 视频是独立合成层，父级 .face 的 border-radius 在 WebView2 里裁不住 → 四角漏白，video 自身再裁一次圆 */
  .pet .face video{border-radius:50%}
  /* 视频形象（2026-11-17）：默认隐藏，setAvatar 识别到 data:video/ 才显示 */
  .pet .face video[hidden]{display:none}
  .bob{animation:bob 2.8s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  /* 新消息：跳三下（比静态角标明显得多，但不夸张） */
  .hop{animation:hop .62s cubic-bezier(.28,1.4,.4,1) 3}
  @keyframes hop{0%{transform:translateY(0) scale(1)}
    22%{transform:translateY(-12px) scale(1.05,.96)}
    52%{transform:translateY(0) scale(.96,1.05)}
    100%{transform:translateY(0) scale(1)}}
  /* 新消息：光环脉冲三下 */
  .ring.on{animation:ring 1.1s ease-out 3}
  @keyframes ring{0%{opacity:.9;transform:scale(.86)}70%{opacity:0;transform:scale(1.35)}100%{opacity:0}}

  .badge{position:absolute;right:-3px;top:-3px;min-width:var(--badge);height:var(--badge);padding:0 5px;border-radius:10px;
    background:#ff3b30;color:#fff;font:700 var(--badgef)/var(--badge) "Microsoft YaHei",sans-serif;text-align:center;
    box-shadow:0 0 0 2px #fff,0 2px 6px rgba(255,59,48,.4)}
  .badge[hidden]{display:none}

  /* 关闭按钮（2026-11-17 二改 老8：平时不显示，鼠标移到 AI 邦灵 上才出现，
     移开后延迟 1000ms 再自动隐藏；隐藏态 pointer-events:none 保证点不到、不挡拖动）。
     放左上角避开右上角的未读角标。 */
  .x{position:absolute;left:-8px;top:-3px;width:var(--xbtn);height:var(--xbtn);border-radius:50%;z-index:7;
    background:rgba(255,255,255,.94);color:#5b6676;text-align:center;cursor:pointer;
    font:700 calc(var(--xbtn) - 5px)/var(--xbtn) "Microsoft YaHei",sans-serif;
    box-shadow:0 1px 4px rgba(16,22,38,.3),0 0 0 1px rgba(16,22,38,.07);
    opacity:0;pointer-events:none;
    transition:opacity .15s ease 1s,background .15s,color .15s,transform .15s}
  .pet:hover .x{opacity:1;pointer-events:auto;transition-delay:0s}
  .x:hover{background:#ff3b30;color:#fff;transform:scale(1.12)}

  /* 名字牌：贴在精灵底部，一眼知道这是 AI 邦灵 */
  .name{position:absolute;left:50%;bottom:-7px;transform:translateX(-50%);
    padding:0 8px;height:var(--nameh);border-radius:8px;background:linear-gradient(135deg,#0082FC,#00a6ff);
    color:#fff;font:700 var(--namefs)/var(--nameh) "Microsoft YaHei",sans-serif;letter-spacing:.5px;white-space:nowrap;
    box-shadow:0 2px 6px rgba(0,130,252,.42)}

  /* 文案气泡
     🔴 max-width 不含 padding（content-box），实际总宽 = max-width + 左右 padding。
        各档 --tipw 已按「窗口宽 - wrap padding - 气泡 padding」扣好，最长文案也不横向溢出。
     🔴 两行截断**不再用 -webkit-line-clamp**（2026-11-18 实测：Chrome 121+ 随
        display:-webkit-box 一起移除，line-clamp 计算值还在但不生效，标准 line-clamp 属性
        也救不回来 → 表现为第 3 行溢出气泡背景）。
        改由 JS 二分截断（fitTip）+ max-height 兜底，两行由脚本保证。 */
  .tip{margin-top:var(--tipmt);max-width:var(--tipw);padding:var(--tippad);border-radius:10px;border-bottom-left-radius:3px;
    background:rgba(16,22,38,.9);color:#fff;font:500 var(--tipfs)/var(--tiplh) "Microsoft YaHei",sans-serif;
    flex:0 0 auto;max-height:calc(var(--tiplh) * 2);overflow:hidden;
    word-break:break-all;box-shadow:0 4px 12px rgba(16,22,38,.3)}
  .tip[hidden]{display:none}

  /* 右键小菜单（窗口窄，菜单就盖在精灵身上） */
  .menu{position:absolute;left:6px;right:6px;top:var(--menutop);padding:4px;border-radius:9px;background:#fff;
    box-shadow:0 8px 24px rgba(16,22,38,.26),0 0 0 1px rgba(16,22,38,.06);display:none;z-index:9}
  .menu.on{display:block}
  .menu div{padding:5px 8px;border-radius:6px;font-size:11.5px;color:#3b4654;cursor:pointer;white-space:nowrap}
  .menu div:hover{background:#eef4ff;color:#0082FC}

  /* 🔴 老客户端（1.6.99 及以前窗口固定 132×148 / 148×196）不注入 data-sz →
     走 :root 默认档（= 小，与「默认小尺寸」口径一致）。精灵缩小后窗口留白多一点，
     但 #wrap 是底部对齐，内容仍完整可见、不被裁、不出滚动条。
     故这里**不再按窗口宽度另做一套缩放** —— 那会让「默认小」变成「默认中」，
     与老8 定的默认档冲突（2026-11-18 验收实测：74px ≠ 小）。 */
</style>
</head>
<body>
<div id="wrap">
  <div class="pet" id="pet" title="AI 邦灵 · 点一下打开邦信">
    <span class="ring" id="ring"></span>
    <div class="face bob" id="bob">
      <img src="fde-avatar.png" alt="AI 邦灵" draggable="false"
           onerror="this.style.display='none';this.parentNode.classList.add('noface')">
      <video id="petVideo" hidden muted loop playsinline autoplay></video>
    </div>
    <span class="badge" id="badge">1</span>
    <span class="x" id="closeBtn" title="关闭 AI 邦灵（托盘「召唤 AI 邦灵」可再叫出来）">✕</span>
    <span class="name">AI 邦灵</span>
  </div>
  <div class="tip" id="tip">有新消息</div>
  <div class="menu" id="menu">
    <div data-act="mute" id="muteItem">静音提示音</div>
    <div data-act="close">收起</div>
  </div>
</div>
<script>
(function () {
  var wrap  = document.getElementById('wrap');
  var pet   = document.getElementById('pet');
  var bob   = document.getElementById('bob');
  var ring  = document.getElementById('ring');
  var badge = document.getElementById('badge');
  var tip   = document.getElementById('tip');
  var menu  = document.getElementById('menu');
  var muteItem = document.getElementById('muteItem');
  var fadeTimer = null;
  var muted = false;
  var lastN = -1;

  function inv(cmd, args) {
    try {
      var c = window.__TAURI__ && window.__TAURI__.core;
      if (c && c.invoke) return c.invoke(cmd, args || {});
    } catch (e) {}
    return { then: function () {} };
  }

  // 🔴 两行截断（2026-11-18）：-webkit-line-clamp 在 Chrome 121+ 已随 display:-webkit-box
  // 一起移除 → 第 3 行溢出气泡背景（实测 clientH 38 / scrollH 68）。
  // 标准 line-clamp 属性、flex+max-height 都救不回来（实测均无效）。
  // 这里用 JS 二分：按**实际渲染高度**裁文本，中英文混排都准，不靠估字数。
  // 内容区可用高度 = 2 行 × line-height（--tiplh）。
  var tipRaw = '';        // 原始文案（未截断），改档位后要重新裁
  function tipContentH() {
    var cs = getComputedStyle(tip);
    return tip.scrollHeight - (parseFloat(cs.paddingTop) || 0) - (parseFloat(cs.paddingBottom) || 0);
  }
  function tipLimitH() {
    var lh = parseFloat(getComputedStyle(tip).lineHeight);
    if (!lh || isNaN(lh)) lh = 15;
    return lh * 2;
  }
  function fitTip(text) {
    tipRaw = text || '';
    if (!tipRaw) { tip.textContent = ''; return ''; }
    // 🔴 隐藏态（display:none）时 scrollHeight 恒为 0 → 会误判「装得下」而不截断。
    //    量的时候临时显示，量完还原。
    var wasHidden = tip.hidden;
    if (wasHidden) tip.hidden = false;
    tip.textContent = tipRaw;
    var limit = tipLimitH();
    var out = tipRaw;
    if (tipContentH() > limit + 0.5) {           // 装不下 → 需要截断
      var lo = 0, hi = tipRaw.length;              // 二分最长的可放下前缀
      while (lo < hi) {
        var mid = (lo + hi + 1) >> 1;
        tip.textContent = tipRaw.slice(0, mid) + '…';
        if (tipContentH() <= limit + 0.5) lo = mid; else hi = mid - 1;
      }
      out = lo > 0 ? tipRaw.slice(0, lo) + '…' : '';
      tip.textContent = out;
    }
    if (wasHidden) tip.hidden = true;
    return out;
  }

  function render(n, t) {
    n = (n | 0) > 0 ? (n | 0) : 0;
    if (n > 0) {
      badge.hidden = false;
      badge.textContent = n > 99 ? '99+' : String(n);
    } else {
      badge.hidden = true;
    }
    t = (t || '').trim();
    tip.hidden = !t;
    fitTip(t);
    return n;
  }

  // 跳三下 + 光环脉冲（2026-11-17：抽出成函数，供 __fdeBump 显式调用）
  function doHop() {
    bob.classList.remove('hop');
    ring.classList.remove('on');
    void bob.offsetWidth;
    bob.classList.add('hop');
    ring.classList.add('on');
  }

  // 入场：弹一下 + 光环脉冲；未读数变化时再跳三下
  // keep=true：**不挂淡出计时**。托盘「召唤 AI 邦灵」用 —— 那时没有未读（n=0），
  // 旧逻辑 8 秒就把自己淡没了，用户点完一抬头屏上已经什么都没有，判成「召唤没反应」。
  function entrance(n, keep) {
    wrap.classList.remove('in', 'out');
    void wrap.offsetWidth;
    wrap.classList.add('in');
    if (lastN >= 0 && n !== lastN) doHop();
    lastN = n;
    // 有未读 → 常驻（Rust 侧同样不挂自动收起）；只有纯提示（n=0）才淡出
    if (fadeTimer) { clearTimeout(fadeTimer); fadeTimer = null }
    if (n <= 0 && !keep) {
      fadeTimer = setTimeout(function () {
        wrap.classList.remove('in');
        wrap.classList.add('out');
      }, 8000);
    }
  }

  var q = new URLSearchParams(location.search);
  var keepOpen = q.get('k') === '1';
  entrance(render(parseInt(q.get('n') || '0', 10), q.get('t') || ''), keepOpen);

  // 🔴 兜底（2026-11-17 mac 白块）：mac 上浮窗出现过「窗口 rect 正常、内容一片空白」——
  // #wrap 初始 opacity:0，只有 JS 跑到 entrance() 才会亮。这条定时器保证：即使脚本被
  // 拦、参数拿不到、或者 CSS 动画没跑到，600ms 后也一定把精灵显示出来，绝不只剩白块。
  setTimeout(function () {
    if (!wrap.classList.contains('in')) {
      wrap.classList.remove('out');
      wrap.classList.add('in');
    }
  }, 600);

  // Rust 侧建窗后走 IPC 注入（不依赖 URL query，mac 的 asset 协议对 query 处理与 win 不同）
  window.__fdeInit = function (n, t, keep) { entrance(render(n, t), keep); };

  // 尺寸档位（2026-11-18 老8：大/中/小，默认小）：Rust 建窗时注入一次 + 改档时注入。
  // 写 data-sz 到 <html>，CSS 变量按档位切换。
  // 老客户端没有这个函数 → 页面保持 :root 默认（= 小），与「默认小」一致。
  window.__fdeSize = function (sz) {
    sz = (sz === 'l' || sz === 'm') ? sz : 's';
    document.documentElement.setAttribute('data-sz', sz);
    // 档位变了 → 气泡可用宽度/字号都变了 → 原来的截断点不再准，重新裁一次
    if (tipRaw) fitTip(tipRaw);
  };
  // 兜底：URL 上带了 sz（Windows 的 query 能带）就先用上，Rust 注入会覆盖。
  var qsz = q.get('sz');
  if (qsz) window.__fdeSize(qsz);

  // Rust 复用已开窗口时调用：原地更新数字/文案，不整窗刷新（避免白闪）
  window.__fdeUpdate = function (n, t, keep) { entrance(render(n, t), keep); };
  // 2026-11-17 老8：群里 @我 / 私聊来消息，即使未读数没变（人正开着那个会话）也要跳。
  // Rust 侧 eval 调用：只跳不重建，也不挂淡出常驻（keep=1）。
  window.__fdeBump = function (t) {
    if (typeof t === 'string' && t) { tip.hidden = false; fitTip(t.slice(0, 120)); }
    wrap.classList.remove('out');
    wrap.classList.add('in');
    doHop();
  };
  window.__fdeOut = function () {
    wrap.classList.remove('in');
    wrap.classList.add('out');
  };

  // ── 拖动 / 单击 ─────────────────────────────────────────────
  // 规则：按下后 200ms 内没有明显位移 → 当单击（唤起主窗）；一旦位移超 4px 或按住超 200ms
  // 仍在按 → 交原生拖动（pet_drag_begin）。小窗既能点又能拖，不用去找小把手。
  var downAt = 0, downX = 0, downY = 0, moved = false, dragStarted = false, holdTimer = null;

  function startDrag() {
    if (dragStarted) return;
    dragStarted = true;
    inv('pet_drag_begin');
  }

  pet.addEventListener('mousedown', function (e) {
    if (e.button !== 0) return;
    e.preventDefault();
    downAt = Date.now(); downX = e.clientX; downY = e.clientY;
    moved = false; dragStarted = false;
    clearTimeout(holdTimer);
    holdTimer = setTimeout(function () { startDrag(); }, 200);
  });

  document.addEventListener('mousemove', function (e) {
    if (!downAt) return;
    if (Math.abs(e.clientX - downX) > 4 || Math.abs(e.clientY - downY) > 4) {
      moved = true;
      clearTimeout(holdTimer);
      startDrag();
    }
  });

  document.addEventListener('mouseup', function (e) {
    if (!downAt) return;
    clearTimeout(holdTimer);
    var quick = Date.now() - downAt < 400;
    var wasDrag = dragStarted;
    downAt = 0;
    if (!moved && quick && !wasDrag) {
      inv('fde_float_click');   // 单击 → 唤起主窗
    } else if (wasDrag) {
      setTimeout(function () { inv('pet_pos_save', {}) }, 260);
    }
  });

  // ── 关闭按钮（✕）───────────────────────────────────────────
  // 必须 stopPropagation：pet 上的 mousedown 会启动「按住 200ms 转拖动、松手当单击唤起主窗」，
  // 点 ✕ 只是关掉精灵，不能顺手把主窗也叫起来。
  var closeBtn = document.getElementById('closeBtn');
  closeBtn.addEventListener('mousedown', function (e) {
    e.stopPropagation();
    e.preventDefault();
  });
  closeBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    inv('pet_close');
  });

  // ── 右键菜单 ───────────────────────────────────────────────
  document.addEventListener('contextmenu', function (e) {
    e.preventDefault();
    menu.classList.add('on');
  });
  document.addEventListener('mousedown', function (e) {
    if (e.button === 2) return;
    if (!menu.contains(e.target)) menu.classList.remove('on');
  }, true);

  menu.addEventListener('click', function (e) {
    var act = e.target && e.target.getAttribute('data-act');
    if (!act) return;
    menu.classList.remove('on');
    if (act === 'mute') {
      muted = !muted;
      muteItem.textContent = muted ? '开启提示音' : '静音提示音';
      inv('pet_set_muted', { on: muted });
    } else if (act === 'close') {
      inv('pet_close');
    }
  });

  inv('pet_status').then(function (s) {
    if (s && typeof s.muted === 'boolean') {
      muted = s.muted;
      muteItem.textContent = muted ? '开启提示音' : '静音提示音';
    }
    if (s && typeof s.avatar === 'string') setAvatar(s.avatar);
  }, function () { /* 老客户端没有这个命令：静默忽略 */ });

  // 形象可配（2026-11-18 老8 定默认）：空串 = 内置默认视频（随包 fde-avatar.mp4）；
  // "sprite" = 卡通精灵；data:image/… = 静态头像；data:video/… = 自选视频（循环静音播）。
  // 加载失败一律回退卡通，不让精灵开天窗。
  var faceImg = document.querySelector('.face img');
  var petVideo = document.getElementById('petVideo');
  var DEFAULT_FACE = 'fde-avatar.png';
  var DEFAULT_VIDEO = 'fde-avatar.mp4';
  function toSprite() {
    petVideo.hidden = true;
    try { petVideo.pause(); petVideo.removeAttribute('src'); petVideo.load(); } catch (e) {}
    faceImg.style.display = '';
    if (faceImg.src.indexOf(DEFAULT_FACE) < 0) faceImg.src = DEFAULT_FACE;
  }
  // 播内置默认视频：失败回退卡通。
  function toDefaultVideo() {
    faceImg.style.display = 'none';
    petVideo.onerror = function () { petVideo.onerror = null; toSprite(); };
    petVideo.hidden = false;
    petVideo.src = DEFAULT_VIDEO;
    try { petVideo.currentTime = 0; var pr = petVideo.play(); if (pr && pr.catch) pr.catch(function () {}); } catch (e) {}
  }
  function setAvatar(u) {
    u = (u || '').trim();
    if (u === 'sprite') { toSprite(); return; }
    if (!u) { toDefaultVideo(); return; }
    if (u.indexOf('data:video/') === 0) {
      // 视频形象：隐藏图片、循环静音播；失败回退卡通
      faceImg.style.display = 'none';
      petVideo.onerror = function () { petVideo.onerror = null; toSprite(); };
      petVideo.hidden = false;
      petVideo.src = u;
      try { petVideo.currentTime = 0; var pr = petVideo.play(); if (pr && pr.catch) pr.catch(function () {}); } catch (e) {}
      return;
    }
    petVideo.hidden = true;
    try { petVideo.pause(); petVideo.removeAttribute('src'); petVideo.load(); } catch (e) {}
    faceImg.style.display = '';
    faceImg.onerror = function () { faceImg.onerror = null; toSprite(); };
    faceImg.src = u;
  }
  window.__fdeAvatar = setAvatar;

  document.addEventListener('dragstart', function (e) { e.preventDefault(); });
})();
</script>
</body>
</html>
